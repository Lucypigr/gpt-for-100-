name: Deploy game to GitHub Pages

on:
  push:
    branches: [gh-pages]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the renderer being published
        run: |
          node --check js/render.js
          node tests/resource-density.js
      - name: Assemble the static game
        run: |
          mkdir _site
          cp index.html play.html _site/
          cp -R assets css js _site/
          touch _site/.nojekyll
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('_site/build-info.json').write_text(json.dumps({
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }) + '\n')
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
