name: Game regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax check
        run: node --check js/rateearth-systems.js && node --check js/weather-visuals.js && node --check js/render.js && node --check js/main.js && node --check js/core.js && node --check js/ai.js && node --check js/chat.js && node --check js/ui.js
      - name: Smoke test
        run: node tests/smoke.js
      - name: AI behavior test
        run: node tests/ai-behavior.js
      - name: AI strategy test
        run: node tests/ai-strategy.js
      - name: AI personality test
        run: node tests/ai-personality.js
      - name: Raider AI test
        run: node tests/ai-raider.js
      - name: Tactic recommendations test
        run: node tests/tactic-recommendations.js
      - name: Warfare regression test
        run: node tests/warfare.js
      - name: Resource density performance test
        run: node tests/resource-density.js
      - name: Land distribution test
        run: node tests/land-distribution.js
      - name: Rate-earth systems regression test
        run: node tests/rateearth-systems.js
      - name: Alliance systems regression test
        run: node tests/alliance-systems.js
      - name: Economy test
        run: node tests/economy.js
      - name: Save/load test
        run: node tests/saveload.js
